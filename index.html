<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración App Web (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho de Envíos</h2>
    
    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1">
        📋 Pegar texto extraído de la guía (Google Lens)
      </label>
      <textarea id="rawText" rows="3" placeholder="Pega aquí todo el texto copiado..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-lg text-xs transition">
        ⚡ Procesar Texto Copiado
      </button>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario</label>
        <input type="text" id="nombre" placeholder="Ej: INGRID CAMPOS" required class="w-full mt-1 p-2 border rounded-lg text-sm">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="text" id="telefono" placeholder="Ej: 584148072041" required class="w-full mt-1 p-2 border rounded-lg text-sm">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" placeholder="Ej: 84692456" required class="w-full mt-1 p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Destino</label>
        <input type="text" id="destino" placeholder="Ej: SOCOPO" required class="w-full mt-1 p-2 border rounded-lg text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
        <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Generar Notificación
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function procesarTextoGuia() {
      var text = document.getElementById("rawText").value;
      if (!text.trim()) {
        alert("Primero pega el texto en el recuadro.");
        return;
      }

      var lineas = text.split("\n");

      // 1. EXTRAER TRACKING
      var matchTrack = text.match(/\b\d{7,20}\b/);
      if (matchTrack) {
        document.getElementById("tracking").value = matchTrack[0];
      }

      // 2. EXTRAER NOMBRE DEL DESTINATARIO (LÓGICA MEJORADA)
      var nombreEncontrado = "";
      
      for (var i = 0; i < lineas.length; i++) {
        var l = lineas[i].trim();
        var lUpper = l.toUpperCase();

        // Ignorar líneas del remitente o de la oficina
        if (lUpper.includes("REMITENTE") || lUpper.includes("ORIGEN") || lUpper.includes("AGENCIA") || lUpper.includes("ENSACADO")) {
          continue;
        }

        // Buscar palabras clave habituales de las 4 empresas
        if (lUpper.includes("DEST") || lUpper.includes("NOMBRE") || lUpper.includes("CLIENTE") || lUpper.includes("CONSIGNA") || lUpper.includes("RECEPTOR")) {
          var limpio = l.replace(/DESTINATARIO/gi, "")
                        .replace(/DESTINO/gi, "")
                        .replace(/DEST/gi, "")
                        .replace(/NOMBRE/gi, "")
                        .replace(/CLIENTE/gi, "")
                        .replace(/CONSIGNATARIO/gi, "")
                        .replace(/RECEPTOR/gi, "")
                        .replace(/RAZON SOCIAL/gi, "")
                        .replace(/[:\-]/g, "")
                        .trim();

          // Limpiar Cédula/RIF si viene en la misma línea (Ej: V-12345678 o V12345678)
          limpio = limpio.replace(/\b[VEPGJ][\-\s]?\d{5,9}\b/gi, "").trim();

          if (limpio.length > 2) {
            nombreEncontrado = limpio;
            break;
          }
        }
      }

      // Respaldos inteligentes si la etiqueta no decía "Destinatario":
      if (!nombreEncontrado) {
        for (var j = 0; j < lineas.length; j++) {
          var lj = lineas[j].trim();
          var ljUpper = lj.toUpperCase();

          // Si una línea tiene una cédula (V-XXXXX) y no es el tracking, asumimos que es la línea del cliente
          if (/\b[V][\-\s]?\d{6,8}\b/i.test(ljUpper) && !ljUpper.includes("TRACKING") && !ljUpper.includes("GUIA")) {
            var limpioFallback = lj.replace(/\b[VEPGJ][\-\s]?\d{5,9}\b/gi, "")
                                   .replace(/DEST/gi, "")
                                   .replace(/[:\-]/g, "")
                                   .trim();
            if (limpioFallback.length > 2) {
              nombreEncontrado = limpioFallback;
              break;
            }
          }
        }
      }

      if (nombreEncontrado) {
        document.getElementById("nombre").value = nombreEncontrado;
      }

      // 3. EXTRAER TELÉFONO
      var matchTelf = text.match(/\b0?(412|424|414|416|426)\d{7}\b/);
      if (matchTelf) {
        var num = matchTelf[0];
        if (num.indexOf("0") === 0) {
          num = "58" + num.substring(1);
        } else if (num.indexOf("58") !== 0) {
          num = "58" + num;
        }
        document.getElementById("telefono").value = num;
      }

      // 4. DETECTAR EMPRESA
      var tUpper = text.toUpperCase();
      if (tUpper.includes("TEALCA")) document.getElementById("empresa").value = "Tealca";
      else if (tUpper.includes("ZOOM")) document.getElementById("empresa").value = "Zoom";
      else if (tUpper.includes("MRW")) document.getElementById("empresa").value = "MRW";
      else if (tUpper.includes("LIBERTY")) document.getElementById("empresa").value = "Liberty Express";

      // 5. EXTRAER DESTINO
      var ciudades = ["SOCOPO", "BARCELONA", "PUERTO LA CRUZ", "LECHERIA", "CARACAS", "VALENCIA", "MARACAIBO", "BARQUISIMETO", "MATURIN", "MARACAY", "MERIDA", "SAN CRISTOBAL", "CUMANA", "PORLAMAR", "PUERTO ORDAZ", "CORO", "PUNTO FIJO", "GUATIRE", "GUARENAS", "CHARALLAVE", "CUA", "LOS TEQUES"];
      for (var c = 0; c < ciudades.length; c++) {
        if (tUpper.includes(ciudades[c])) {
          document.getElementById("destino").value = ciudades[c];
          break;
        }
      }
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var nombre = document.getElementById("nombre").value.trim();
      var telf = document.getElementById("telefono").value.trim();
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var destino = document.getElementById("destino").value.trim();
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "🏠 Destino: " + destino + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + " | 🏠 " + destino + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
