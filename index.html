<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho Rápido V91 - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho Rápido V91 - Myriedesign</h2>
    
    <!-- BLOQUE GOOGLE LENS -->
    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1">
        📋 1. Pega aquí el texto de Google Lens de la guía
      </label>
      <textarea id="rawText" rows="3" placeholder="Pega todo el texto copiado de la guía aquí..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" id="btnProcesar" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition active:bg-blue-800 shadow">
        ⚡ Extraer Destinatario y Teléfono
      </button>
    </div>

    <!-- FORMULARIO EDITABLE -->
    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">2. Destinatario (Editable o por voz)</label>
        <input type="text" id="nombre" required placeholder="Nombre del cliente" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none bg-white">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">3. Teléfono (Editable o dictando con mic)</label>
        <input type="text" id="telefono" required placeholder="Ej. 04121234567" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none bg-white">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa de Envío</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white text-gray-900 font-medium">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
          <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
        </div>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
        🚀 Generar Notificación WhatsApp
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function convertirPalabrasANumeros(texto) {
      if (!texto) return "";
      var t = texto.toLowerCase();
      var mapa = {
        'cero': '0', 'uno': '1', 'un': '1', 'dos': '2', 'tres': '3', 
        'cuatro': '4', 'cinco': '5', 'seis': '6', 'siete': '7', 
        'ocho': '8', 'nueve': '9'
      };
      for (var palabra in mapa) {
        var regex = new RegExp('\\b' + palabra + '\\b', 'g');
        t = t.replace(regex, mapa[palabra]);
      }
      return t;
    }

    function limpiarTelefonoStrict(numBruto) {
      if (!numBruto) return "";
      var traducido = convertirPalabrasANumeros(numBruto);
      var num = traducido.replace(/\D/g, "");
      
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) return num;
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num.substring(1);
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num;
      return num;
    }

    function limpiarNombreCompleto(s) {
      if (!s) return "";
      var limpio = s
        .replace(/DESTINATARIO|DESTINATARI0|DEST\.|DEST:|DEST/gi, "")
        .replace(/REMITENTE:|REMITENTE/gi, "")
        .replace(/NOMBRE:?|N0MBRE:?|NOMBRE|N0MBRE/gi, "")
        .replace(/[VE]-?\d{6,8}/gi, "")
        .replace(/TLF:?\s*0?\d{10,11}/gi, "")
        .replace(/TEL[EÉ]FONO:?\s*0?\d{10,11}/gi, "")
        .replace(/^[\|\/\\\,\.\-_\:\;\s]+/g, "")
        .replace(/[\|\/\\\,\.\-_]+$/g, "")
        .trim();

      var palabras = limpio.split(/\s+/);
      var unicas = [];
      for (var p = 0; p < palabras.length; p++) {
        var palabraActual = palabras[p].toLowerCase();
        var esDuplicadoAdyacente = (p > 0 && palabraActual === palabras[p - 1].toLowerCase());
        
        var esDuplicadoMitad = false;
        if (palabras.length % 2 === 0 && p >= palabras.length / 2) {
          var mitad = palabras.length / 2;
          if (palabras[p].toLowerCase() === palabras[p - mitad].toLowerCase()) {
            esDuplicadoMitad = true;
          }
        }

        if (!esDuplicadoAdyacente && !esDuplicadoMitad) {
          unicas.push(palabras[p]);
        }
      }
      return unicas.join(" ");
    }

    function procesarTextoGuia() {
      try {
        var text = document.getElementById("rawText").value;
        if (!text || !text.trim()) {
          alert("Primero pega el texto extraído por Google Lens.");
          return;
        }

        var tUpper = text.toUpperCase();

        // 1. Detectar Empresa
        var empresaDetectada = "MRW";
        if (tUpper.indexOf("TEALCA") !== -1 || tUpper.indexOf("TEALLA") !== -1) {
          empresaDetectada = "Tealca";
        } else if ((tUpper.indexOf("ZOOM") !== -1 || tUpper.indexOf("MER") !== -1) && tUpper.indexOf("ENSACADO") === -1) {
          empresaDetectada = "Zoom";
        } else if (tUpper.indexOf("LAE") !== -1 || tUpper.indexOf("EL DORADO") !== -1) {
          empresaDetectada = "LAE";
        }
        document.getElementById("empresa").value = empresaDetectada;

        var lineas = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        var nombreFinal = "";

        // 2. REGLA ESPECÍFICA PARA TEALCA (Línea 8 o búsqueda por palabra clave)
        if (empresaDetectada === "Tealca" && lineas.length >= 8) {
          var lineaNombre = lineas[7]; // Índice 7 es la línea 8 exacta
          var partesNombre = lineaNombre.split(/N[O0]MBRE:?/i);
          nombreFinal = limpiarNombreCompleto(partesNombre.length > 1 ? partesNombre[1] : lineaNombre);
        }

        // Si no se llenó con la línea 8 fija, busca dinámicamente por la palabra NOMBRE en cualquier línea
        if (!nombreFinal || nombreFinal.length < 3) {
          for (var i = 0; i < lineas.length; i++) {
            var lUp = lineas[i].toUpperCase();
            if (lUp.indexOf("NOMBRE") !== -1 || lUp.indexOf("N0MBRE") !== -1) {
              var partesNombre = lineas[i].split(/N[O0]MBRE:?/i);
              nombreFinal = limpiarNombreCompleto(partesNombre.length > 1 ? partesNombre[1] : "");
              if (!nombreFinal && i + 1 < lineas.length) {
                nombreFinal = limpiarNombreCompleto(lineas[i + 1]);
              }
              break;
            }
          }
        }

        // Respaldo final si no encuentra "NOMBRE"
        if (!nombreFinal || nombreFinal.length < 3) {
          if (empresaDetectada === "Zoom" && lineas.length >= 6) {
            nombreFinal = limpiarNombreCompleto(lineas[5]);
          } else if (empresaDetectada === "MRW" && lineas.length >= 7) {
            nombreFinal = limpiarNombreCompleto(lineas[6]);
          }
        }

        document.getElementById("nombre").value = nombreFinal;

        // 3. TELÉFONO DEL CLIENTE (Último número válido del texto)
        var todosLosTelefonos = [];
        for (var t = 0; t < lineas.length; t++) {
          var matchT = lineas[t].match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
          if (matchT) {
            var tFmt = limpiarTelefonoStrict(matchT[0]);
            if (tFmt) {
              todosLosTelefonos.push(tFmt);
            }
          }
        }

        if (todosLosTelefonos.length > 0) {
          document.getElementById("telefono").value = todosLosTelefonos[todosLosTelefonos.length - 1];
        } else {
          document.getElementById("telefono").value = "";
        }

      } catch (e) {
        alert("Error al procesar: " + e.message);
      }
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var telfBruto = document.getElementById("telefono").value.trim();
      var telf = limpiarTelefonoStrict(telfBruto);
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado por " + empresa + ". Aquí el resumen:\n\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2 shadow-sm";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " | 📱 " + telf + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
