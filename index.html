<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho de Envíos V30</h2>
    
    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1">
        📋 Pegar texto extraído de la guía (Google Lens)
      </label>
      <textarea id="rawText" rows="3" placeholder="Pega aquí todo el texto copiado..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" id="btnProcesar" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition active:bg-blue-800">
        ⚡ Procesar Texto Copiado
      </button>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario</label>
        <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="text" id="telefono" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white text-gray-900 font-medium">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
        <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Generar Notificación
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function formatearTelefonoStrict(numBruto) {
      if (!numBruto) return "";
      var num = numBruto.replace(/\D/g, "");
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) return num;
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num.substring(1);
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num;
      return "";
    }

    function procesarTextoGuia() {
      try {
        var text = document.getElementById("rawText").value;
        if (!text || !text.trim()) {
          alert("Primero pega el texto en el recuadro.");
          return;
        }

        var tUpper = text.toUpperCase();

        // 1. DETECTAR EMPRESA
        var empresaDetectada = "MRW";
        if (tUpper.indexOf("TEALCA") !== -1) empresaDetectada = "Tealca";
        else if (tUpper.indexOf("ZOOM") !== -1 || tUpper.indexOf("GRUPO ZOOM") !== -1) empresaDetectada = "Zoom";
        else if (tUpper.indexOf("MRW") !== -1) empresaDetectada = "MRW";
        else if (tUpper.indexOf("LIBERTY") !== -1) empresaDetectada = "Liberty Express";

        document.getElementById("empresa").value = empresaDetectada;

        // ========================================================
        // LÓGICA 1: MRW (¡INTACTA TAL COMO LA DEJASTE!)
        // ========================================================
        if (empresaDetectada === "MRW") {
          var lineas = text.split("\n");

          // Teléfono Estricto MRW
          var tlfEncontrado = "";
          var matchTelf = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/g);
          if (matchTelf && matchTelf.length > 0) {
            for (var m = 0; m < matchTelf.length; m++) {
              var tValido = formatearTelefonoStrict(matchTelf[m]);
              if (tValido) { tlfEncontrado = tValido; break; }
            }
          }
          document.getElementById("telefono").value = tlfEncontrado;

          // Destinatario MRW
          var nombreEncontrado = "";
          for (var i = 0; i < lineas.length; i++) {
            var l = lineas[i].trim();
            var lUpper = l.toUpperCase();
            if (lUpper.indexOf("ESTINATARIO") !== -1 || lUpper.indexOf("DEST:") !== -1) {
              var limpioMisma = depurarNombreMRW(l);
              if (limpioMisma.length > 2 && !esBasuraMRW(limpioMisma)) {
                nombreEncontrado = limpioMisma;
              } else {
                for (var sub = 1; sub <= 2; sub++) {
                  if (i + sub < lineas.length) {
                    var sigLinea = lineas[i + sub].trim();
                    if (esBasuraMRW(sigLinea)) continue;
                    var limpioSig = depurarNombreMRW(sigLinea);
                    if (limpioSig.length > 2 && !esBasuraMRW(limpioSig)) {
                      nombreEncontrado = limpioSig;
                      break;
                    }
                  }
                }
              }
              if (nombreEncontrado) break;
            }
          }

          if (!nombreEncontrado) {
            for (var j = 0; j < lineas.length; j++) {
              var lj = lineas[j].trim();
              if (esBasuraMRW(lj)) continue;
              var limpioFallback = depurarNombreMRW(lj);
              if (limpioFallback.length > 3 && /[a-zA-Z]/.test(limpioFallback) && !esBasuraMRW(limpioFallback)) {
                nombreEncontrado = limpioFallback;
                break;
              }
            }
          }
          if (nombreEncontrado) document.getElementById("nombre").value = nombreEncontrado;

          // Tracking MRW
          var trackingEncontrado = "";
          for (var k = 0; k < lineas.length; k++) {
            var lk = lineas[k].toUpperCase();
            if (lk.indexOf("TRACKING") !== -1 || lk.indexOf("GUIA") !== -1 || lk.indexOf("GUÍA") !== -1 || lk.indexOf("DOC") !== -1 || lk.indexOf("NRO") !== -1) {
              var mTrackL = lineas[k].match(/\b\d{7,14}\b/);
              if (mTrackL) { trackingEncontrado = mTrackL[0]; break; }
            }
          }
          if (!trackingEncontrado) {
            var numTelfPuro = tlfEncontrado ? tlfEncontrado.replace("58", "") : "";
            var todosNumeros = text.match(/\b\d{8,14}\b/g) || [];
            for (var n = 0; n < todosNumeros.length; n++) {
              var candidate = todosNumeros[n];
              if (numTelfPuro && candidate.indexOf(numTelfPuro) !== -1) continue;
              if (/^(0?412|0?424|0?414|0?416|0?426)/.test(candidate)) continue;
              trackingEncontrado = candidate;
              break;
            }
          }
          if (trackingEncontrado) document.getElementById("tracking").value = trackingEncontrado;
          return; // Fin de MRW, totalmente aislada.
        }

        // ========================================================
        // LÓGICA 2: ZOOM (Aislada e independiente para cuando la probemos)
        // ========================================================
        if (empresaDetectada === "Zoom") {
          // Aquí pondremos de forma aislada la lógica exclusiva para Zoom cuando compartas el texto/foto de Zoom
          alert("Empresa Zoom detectada. Preparando lógica aislada para Zoom.");
          return;
        }

      } catch (e) {
        alert("Error al procesar: " + e.message);
      }
    }

    // Funciones auxiliares exclusivas de MRW para mantener el aislamiento total
    function esBasuraMRW(texto) {
      var t = texto.toUpperCase().trim();
      if (!t) return true;
      if (t === "MRW") return true;
      if (t.indexOf("RETIRAR POR") !== -1 || t.indexOf("OFICIN") !== -1 || t.indexOf("ENSACADO") !== -1 || t.indexOf("CUPONES") !== -1) return true;
      if (t.indexOf("DIRECCION") !== -1 || t.indexOf("REMITENTE") !== -1 || t.indexOf("COBRO EN DESTINO") !== -1) return true;
      if (t.indexOf("RIF") !== -1 || t.indexOf("COD.SEG") !== -1 || t.indexOf("BISUTERIA") !== -1) return true;
      if (t.indexOf("TRACKING") !== -1) return true;
      return false;
    }

    function depurarNombreMRW(txt) {
      var resultado = txt.replace(/^[\|\/\\\,\.\-_\:\;\s\d]+/g, "");
      resultado = resultado.replace(/destinatario[\s:]*/gi, "").replace(/\bDESTINO\b[:]?/gi, "").replace(/\bDEST\b[\s:]*/gi, "");
      resultado = resultado.replace(/TLF[\s:\.]*\d+/gi, "").replace(/\b(?:0)?(412|424|414|416|426)\d{7}\b/g, "").replace(/[:\.\-]/g, " ");
      return resultado.trim();
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var telf = document.getElementById("telefono").value.trim();
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
