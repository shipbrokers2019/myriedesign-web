<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho de Envíos V24</h2>
    
    <!-- Selector de Empresa -->
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">🏢 Seleccionar Empresa de Envío</label>
      <select id="empresa" onchange="cambiarEmpresa()" class="w-full p-2 border rounded-lg text-sm bg-blue-50 text-blue-900 font-bold border-blue-300">
        <option value="MRW">MRW (Sin nombre impreso)</option>
        <option value="Zoom">Zoom (Con nombre impreso)</option>
        <option value="Tealca">Tealca (Con nombre impreso)</option>
        <option value="LAE">LAE (Con nombre impreso)</option>
      </select>
    </div>

    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1" id="labelInstruccion">
        📋 Pegar texto de Guía MRW (Google Lens)
      </label>
      <textarea id="rawText" rows="4" placeholder="Pega aquí el texto de la guía..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" id="btnProcesar" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition active:bg-blue-800">
        ⚡ Procesar Texto Específico
      </button>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario</label>
        <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium" placeholder="Nombre del cliente">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="text" id="telefono" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium" placeholder="Teléfono del cliente">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium" placeholder="Solo números">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
          <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Generar Notificación
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function cambiarEmpresa() {
      var empresaSeleccionada = document.getElementById("empresa").value;
      document.getElementById("labelInstruccion").innerText = "📋 Pegar texto de Guía " + empresaSeleccionada + " (Google Lens)";
    }

    function formatearTelefonoStrict(numBruto) {
      if (!numBruto) return "";
      var num = numBruto.replace(/\D/g, "");
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) return num;
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num.substring(1);
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num;
      return "";
    }

    function procesarTextoGuia() {
      try {
        var text = document.getElementById("rawText").value;
        var empresa = document.getElementById("empresa").value;

        if (!text || !text.trim()) {
          alert("Primero pega el texto en el recuadro.");
          return;
        }

        var lineas = text.split("\n").map(function(l) { return l.trim(); }).filter(Boolean);

        var trackingEncontrado = "";
        var tlfEncontrado = "";
        var nombreEncontrado = "";

        // ========================================================
        // 1. LÓGICA INTELIGENTE PARA MRW
        // ========================================================
        if (empresa === "MRW") {
          // A. Tracking: Buscar número de 8 a 20 dígitos
          for (var k = 0; k < lineas.length; k++) {
            var lk = lineas[k].toUpperCase();
            if (lk.indexOf("TRACKING") !== -1 || lk.indexOf("GUIA") !== -1 || lk.indexOf("N°") !== -1) {
              var m = lineas[k].match(/\b\d{8,20}\b/);
              if (m) { trackingEncontrado = m[0]; break; }
            }
          }
          if (!trackingEncontrado) {
            var matchGen = text.match(/\b\d{8,20}\b/);
            if (matchGen) trackingEncontrado = matchGen[0];
          }

          // B. Teléfono
          var matchTelfGeneral = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
          if (matchTelfGeneral) {
            tlfEncontrado = formatearTelefonoStrict(matchTelfGeneral[0]);
          }

          // C. Destinatario inteligente para MRW:
          // Busca la primera línea que NO sea basura (cobro, tracking, números puros, ensacado)
          for (var i = 0; i < lineas.length; i++) {
            var l = lineas[i];
            var lUp = l.toUpperCase();

            var esBasura = 
              lUp.indexOf("COBRO") !== -1 ||
              lUp.indexOf("TRACKING") !== -1 ||
              lUp.indexOf("ENSACADO") !== -1 ||
              lUp.indexOf("CANT") !== -1 ||
              lUp.indexOf("CUPONES") !== -1 ||
              lUp.indexOf("B8.") !== -1 ||
              /^\d+$/.test(l) || // Si es solo un número
              l.length < 3;

            if (!esBasura) {
              nombreEncontrado = l;
              break;
            }
          }
        }

        // ========================================================
        // 2, 3, 4. BLOQUES PARA ZOOM, TEALCA, LAE
        // ========================================================
        else {
          var matchGen = text.match(/\b\d{8,20}\b/);
          if (matchGen) trackingEncontrado = matchGen[0];

          for (var i = 0; i < lineas.length; i++) {
            var lineaActual = lineas[i];
            var matchTelf = lineaActual.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
            if (matchTelf) {
              tlfEncontrado = formatearTelefonoStrict(matchTelf[0]);
              var partes = lineaActual.split(matchTelf[0]);
              if (partes.length > 0) {
                nombreEncontrado = partes[0].replace(/[\s\-\,\.\_\/]+$/, "").trim();
              }
              break;
            }
          }
        }

        document.getElementById("tracking").value = trackingEncontrado;
        document.getElementById("telefono").value = tlfEncontrado;
        document.getElementById("nombre").value = nombreEncontrado;

      } catch (e) {
        alert("Error al procesar: " + e.message);
      }
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var nombre = document.getElementById("nombre").value.trim();
      var telf = document.getElementById("telefono").value.trim();
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
