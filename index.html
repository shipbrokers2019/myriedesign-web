<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho de Envíos V51</h2>
    
    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1">
        📋 Pegar texto extraído de la guía (Google Lens)
      </label>
      <textarea id="rawText" rows="3" placeholder="Pega aquí todo el texto copiado..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" id="btnProcesar" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition active:bg-blue-800">
        ⚡ Procesar Texto Copiado
      </button>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario</label>
        <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="text" id="telefono" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white text-gray-900 font-medium">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
        <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Generar Notificación
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function formatearTelefonoStrict(numBruto) {
      if (!numBruto) return "";
      var num = numBruto.replace(/\D/g, "");
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) return num;
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num.substring(1);
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) return "58" + num;
      return "";
    }

    function limpiarNombreFinal(txt) {
      if (!txt) return "";
      var limpio = txt.replace(/^[a-z]*tinatario[:\s]*/gi, "")
                        .replace(/^[a-z]*atario[:\s]*/gi, "")
                        .replace(/^([a-z]{1,5})[:\s]+/gi, "")
                        .replace(/destinatalio[:\s]*/gi, "")
                        .replace(/destinatario[:\s]*/gi, "")
                        .replace(/destinatio[:\s]*/gi, "")
                        .replace(/destinat[:\s]*/gi, "")
                        .replace(/destin[:\s]*/gi, "")
                        .replace(/alario[:\s]*/gi, "")
                        .replace(/lario[:\s]*/gi, "");
      
      if (limpio.indexOf("-") !== -1) {
        limpio = limpio.split("-")[0].trim();
      }

      limpio = limpio.replace(/^[\|\/\\\,\.\-_\:\;\s]+/g, "").trim();

      var palabras = limpio.split(/\s+/);
      if (palabras.length >= 4) {
        for (var tam = Math.floor(palabras.length / 2); tam >= 2; tam--) {
          var parte1 = palabras.slice(0, tam).join(" ").toUpperCase();
          var parte2 = palabras.slice(tam, tam * 2).join(" ").toUpperCase();
          if (parte1 === parte2) {
            limpio = palabras.slice(0, tam).join(" ");
            break;
          }
        }
      }

      return limpio.trim();
    }

    function procesarTextoGuia() {
      try {
        var text = document.getElementById("rawText").value;
        if (!text || !text.trim()) {
          alert("Primero pega el texto en el recuadro.");
          return;
        }

        var tUpper = text.toUpperCase();

        // Detección blindada de empresa
        var empresaDetectada = "MRW";
        if (tUpper.indexOf("TEALCA") !== -1) {
          empresaDetectada = "Tealca";
        } else if ((tUpper.indexOf("ZOOM") !== -1 || tUpper.indexOf("MER") !== -1) && tUpper.indexOf("ENSACADO") === -1 && tUpper.indexOf("CUPONES") === -1) {
          empresaDetectada = "Zoom";
        } else if (tUpper.indexOf("LAE") !== -1 || tUpper.indexOf("EL DORADO") !== -1) {
          empresaDetectada = "LAE";
        }

        document.getElementById("empresa").value = empresaDetectada;

        // ========================================================
        // BLOQUE 1: MRW (Protegido e Intacto)
        // ========================================================
        if (empresaDetectada === "MRW") {
          var lineas = text.split("\n");
          var nombreEncontrado = "";

          for (var i = 0; i < lineas.length; i++) {
            var l = lineas[i].trim();
            var lUpper = l.toUpperCase();
            if (lUpper.indexOf("ESTINAT") !== -1 || lUpper.indexOf("DEST") !== -1 || lUpper.indexOf("CM.") !== -1 || lUpper.indexOf("DIR;") !== -1) {
              if (lUpper.indexOf("DIR;") !== -1 || lUpper.indexOf("CALLE") !== -1 || lUpper.indexOf("AV.") !== -1) continue;
              var limpioMisma = depurarNombreMRW(l);
              if (limpioMisma.length > 2 && !esBasuraMRW(limpioMisma)) {
                nombreEncontrado = limpioMisma;
                break;
              }
            }
          }

          if (!nombreEncontrado) {
            for (var j = 0; j < lineas.length; j++) {
              var lj = lineas[j].trim();
              if (esBasuraMRW(lj)) continue;
              var limpioFallback = depurarNombreMRW(lj);
              if (limpioFallback.length > 3 && /[a-zA-Z]/.test(limpioFallback) && !esBasuraMRW(limpioFallback) && limpioFallback.indexOf("DIR;") === -1 && limpioFallback.indexOf("CALLE") === -1) {
                nombreEncontrado = limpioFallback;
                break;
              }
            }
          }

          if (nombreEncontrado) {
            document.getElementById("nombre").value = limpiarNombreFinal(nombreEncontrado);
          }

          var tlfEncontrado = "";
          var matchTGlobal = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
          if (matchTGlobal) {
            tlfEncontrado = formatearTelefonoStrict(matchTGlobal[0]);
          }
          document.getElementById("telefono").value = tlfEncontrado;

          var trackingEncontrado = "";
          for (var k = 0; k < lineas.length; k++) {
            var lk = lineas[k].toUpperCase();
            if (lk.indexOf("TRACKING") !== -1 || lk.indexOf("GUIA") !== -1 || lk.indexOf("GUÍA") !== -1 || lk.indexOf("DOC") !== -1 || lk.indexOf("NRO") !== -1) {
              var mTrackL = lineas[k].match(/\b\d{10,15}\b/);
              if (mTrackL) { trackingEncontrado = mTrackL[0]; break; }
            }
          }
          if (!trackingEncontrado) {
            var todosNumeros = text.match(/\b\d{10,15}\b/g) || [];
            if (todosNumeros.length > 0) {
              trackingEncontrado = todosNumeros[0];
            }
          }
          if (trackingEncontrado) document.getElementById("tracking").value = trackingEncontrado;
          return;
        }

        // ========================================================
        // BLOQUE 2: ZOOM (Protegido e Intacto)
        // ========================================================
        if (empresaDetectada === "Zoom") {
          var lineasZoom = text.split("\n");
          
          var trackZoom = "";
          for (var z = 0; z < lineasZoom.length; z++) {
            var mZ = lineasZoom[z].match(/\b\d{10}\b/);
            if (mZ) { trackZoom = mZ[0]; break; }
          }
          if (!trackZoom) {
            var mGenZ = text.match(/\b\d{10}\b/);
            if (mGenZ) trackZoom = mGenZ[0];
          }
          if (trackZoom) document.getElementById("tracking").value = trackZoom;

          var nombreZoom = "";
          for (var iz = 0; iz < lineasZoom.length; iz++) {
            var lzUp = lineasZoom[iz].toUpperCase();
            if (lzUp.indexOf("DESTINAT") !== -1 || lzUp.indexOf("DESTINATALIO") !== -1 || lzUp.indexOf("DESTINATIO") !== -1 || lzUp.indexOf("BESTINATARIO") !== -1) {
              nombreZoom = lineasZoom[iz];
              break;
            }
          }

          if (!nombreZoom) {
            for (var rx = 0; rx < lineasZoom.length; rx++) {
              var lRx = lineasZoom[rx].trim();
              var lRxUp = lRx.toUpperCase();
              if (lRxUp.indexOf("REMITENTE") !== -1 || lRxUp.indexOf("ZOOM") !== -1 || lRxUp.indexOf("MER") !== -1 || lRxUp.indexOf("BISUTERIA") !== -1 || lRxUp.indexOf("BIGUTERIA") !== -1 || lRxUp.indexOf("COD") !== -1 || lRxUp.length < 4) continue;
              if (/\d/.test(lRx)) continue;
              nombreZoom = lRx;
              break;
            }
          }

          if (nombreZoom) {
            document.getElementById("nombre").value = limpiarNombreFinal(nombreZoom);
          }

          var tlfZoom = "";
          var matchGenTz = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/g);
          if (matchGenTz && matchGenTz.length > 0) {
            tlfZoom = formatearTelefonoStrict(matchGenTz[matchGenTz.length - 1]);
          }
          document.getElementById("telefono").value = tlfZoom;
          return;
        }

        // ========================================================
        // BLOQUE 3: TEALCA (Nuevo y Optimizado)
        // ========================================================
        if (empresaDetectada === "Tealca") {
          var lineasTealca = text.split("\n");

          // 1. Tracking Tealca (usualmente tras la palabra GUIA:)
          var trackTealca = "";
          for (var t = 0; t < lineasTealca.length; t++) {
            var lt = lineasTealca[t].toUpperCase();
            if (lt.indexOf("GUIA") !== -1 || lt.indexOf("GUÍA") !== -1) {
              var mT = lineasTealca[t].match(/\b\d{6,10}\b/);
              if (mT) { trackTealca = mT[0]; break; }
              // Si el número está en la línea siguiente
              if (t + 1 < lineasTealca.length) {
                var mTNext = lineasTealca[t + 1].match(/\b\d{6,10}\b/);
                if (mTNext) { trackTealca = mTNext[0]; break; }
              }
            }
          }
          if (!trackTealca) {
            var mGenT = text.match(/\b\d{7,8}\b/);
            if (mGenT) trackTealca = mGenT[0];
          }
          if (trackTealca) document.getElementById("tracking").value = trackTealca;

          // 2. Teléfono Tealca
          var tlfTealca = "";
          for (var tl = 0; tl < lineasTealca.length; tl++) {
            var ltlUp = lineasTealca[tl].toUpperCase();
            if (ltlUp.indexOf("TELEFONO") !== -1 || ltlUp.indexOf("TLF") !== -1) {
              var mPhone = lineasTealca[tl].match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
              if (mPhone) {
                tlfTealca = formatearTelefonoStrict(mPhone[0]);
                break;
              } else if (tl + 1 < lineasTealca.length) {
                var mPhoneNext = lineasTealca[tl + 1].match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
                if (mPhoneNext) {
                  tlfTealca = formatearTelefonoStrict(mPhoneNext[0]);
                  break;
                }
              }
            }
          }
          if (!tlfTealca) {
            var matchGenT = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/);
            if (matchGenT) tlfTealca = formatearTelefonoStrict(matchGenT[0]);
          }
          document.getElementById("telefono").value = tlfTealca;

          // 3. Nombre / Destinatario Tealca (busca la línea NOMBRE)
          var nombreTealca = "";
          for (var tn = 0; tn < lineasTealca.length; tn++) {
            var ltnUp = lineasTealca[tn].toUpperCase();
            if (ltnUp.indexOf("NOMBRE") !== -1) {
              var limpiaN = lineasTealca[tn].replace(/NOMBRE[:\s]*/gi, "").trim();
              if (limpiaN.length > 2) {
                nombreTealca = limpiaN;
                break;
              } else if (tn + 1 < lineasTealca.length) {
                nombreTealca = lineasTealca[tn + 1].trim();
                break;
              }
            }
          }
          if (nombreTealca) {
            document.getElementById("nombre").value = limpiarNombreFinal(nombreTealca);
          }
          return;
        }

      } catch (e) {
        alert("Error al procesar: " + e.message);
      }
    }

    function esBasuraMRW(texto) {
      var t = texto.toUpperCase().trim();
      if (!t) return true;
      if (t === "MRW" || t.indexOf("V-") !== -1 || t.indexOf("E-") !== -1) return true;
      if (t.indexOf("RETIRAR POR") !== -1 || t.indexOf("OFICIN") !== -1 || t.indexOf("ENSACADO") !== -1 || t.indexOf("CUPONES") !== -1) return true;
      if (t.indexOf("DIRECCION") !== -1 || t.indexOf("REMITENTE") !== -1 || t.indexOf("COBRO EN DESTINO") !== -1) return true;
      if (t.indexOf("RIF") !== -1 || t.indexOf("COD.SEG") !== -1 || t.indexOf("BSUTERIA") !== -1 || t.indexOf("BISUTERIA") !== -1 || t.indexOf("BIGUTERIA") !== -1) return true;
      if (t.indexOf("TRACKING") !== -1 || t.indexOf("BS.") !== -1) return true;
      return false;
    }

    function depurarNombreMRW(txt) {
      var resultado = txt.replace(/^[\|\/\\\,\.\-_\:\;\s\d]+/g, "");
      resultado = resultado.replace(/destinatario[\s:]*/gi, "").replace(/\bDESTINO\b[:]?/gi, "").replace(/\bDEST\b[\s:]*/gi, "");
      resultado = resultado.replace(/\b[VvEeJjGg][-\s]?\d{6,9}\b/g, "");
      resultado = resultado.replace(/TLF[\s:\.]*\d+/gi, "").replace(/\b(?:0)?(412|424|414|416|426)\d{7}\b/g, "").replace(/[:\.\-]/g, " ");
      return resultado.trim();
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var telf = document.getElementById("telefono").value.trim();
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
