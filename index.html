<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho Rápido - Myriedesign</h2>
    
    <div class="bg-green-50 border border-green-200 p-2.5 rounded-lg text-center">
      <p class="text-xs text-green-800 font-medium">💡 <strong>Consejo:</strong> Usa el dictado por voz de tu teclado para llenar los campos en segundos sin escribir.</p>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario (Cliente)</label>
        <input type="text" id="nombre" required placeholder="Ej. María Pérez" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="tel" id="telefono" required placeholder="Ej. 04121234567 o 58412..." class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" required placeholder="Número de guía" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
        <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium focus:ring-2 focus:ring-blue-400 outline-none">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
        🚀 Generar Notificación WhatsApp
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Historial de Hoy</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function limpiarTelefono(numBruto) {
      if (!numBruto) return "";
      var num = numBruto.replace(/\D/g, "");
      // Si empieza por 0 (ej. 0412...), le quitamos el 0 y le agregamos 58
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) {
        return "58" + num.substring(1);
      }
      // Si ya viene con 58 (ej. 58412...)
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) {
        return num;
      }
      // Si el usuario puso directo los 10 dígitos (ej. 4121234567)
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) {
        return "58" + num;
      }
      return num; // Retorna limpio por si acaso
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var telfBruto = document.getElementById("telefono").value.trim();
      var telf = limpiarTelefono(telfBruto);
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2 shadow-sm";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("fecha").valueAsDate = new Date();
      document.getElementById("nombre").focus();
    });
  </script>
</body>
</html>
