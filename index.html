<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despacho de Envíos - Myriedesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 text-center">Despacho de Envíos</h2>
    
    <div class="bg-blue-50 border-2 border-dashed border-blue-300 p-3 rounded-xl">
      <label class="block text-xs font-bold text-blue-800 mb-1">
        📋 Pegar texto extraído de la guía (Google Lens)
      </label>
      <textarea id="rawText" rows="3" placeholder="Pega aquí todo el texto copiado..." class="w-full p-2 border border-blue-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
      <button type="button" id="btnProcesar" onclick="procesarTextoGuia()" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition active:bg-blue-800">
        ⚡ Procesar Texto Copiado
      </button>
    </div>

    <form id="guiaForm" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-700">Destinatario</label>
        <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>
      
      <div>
        <label class="block text-xs font-bold text-gray-700">Teléfono (WhatsApp)</label>
        <input type="text" id="telefono" class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">N° Tracking / Guía</label>
          <input type="text" id="tracking" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Empresa</label>
          <select id="empresa" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white text-gray-900 font-medium">
            <option value="MRW">MRW</option>
            <option value="Tealca">Tealca</option>
            <option value="Zoom">Zoom</option>
            <option value="LAE">LAE</option>
            <option value="Liberty Express">Liberty Express</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700">Fecha de Envío</label>
        <input type="date" id="fecha" required class="w-full mt-1 p-2 border rounded-lg text-sm text-gray-900 font-medium">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Generar Notificación
      </button>
    </form>

    <hr class="my-4">

    <h3 class="text-sm font-bold text-gray-800">Mensajes Listos</h3>
    <div id="listaGuias" class="space-y-3"></div>
  </div>

  <script>
    document.getElementById("fecha").valueAsDate = new Date();

    function esLineaBasura(texto) {
      var t = texto.toUpperCase().trim();
      if (!t) return true;
      if (t.indexOf("*") !== -1) return true; // Ignorar asteriscos de cédulas censuradas
      if (t === "ZOOM" || t === "GRUPO ZOOM" || t === "MRW" || t === "TEALCA") return true;
      if (t.indexOf("RETIRAR POR") !== -1 || t.indexOf("RETIRO POR") !== -1) return true;
      if (t.indexOf("OFICIN") !== -1) return true;
      if (t.indexOf("ENTREGAR EN AGENCIA") !== -1 || t.indexOf("ENTREGA") !== -1) return true;
      if (t.indexOf("ENSACADO") !== -1) return true;
      if (t.indexOf("CUPONES") !== -1) return true;
      if (t.indexOf("DIRECCION") !== -1 || t.indexOf("DIRECCIÓN") !== -1) return true;
      if (t.indexOf("CIUDAD") !== -1) return true;
      if (t.indexOf("REMITENTE") !== -1) return true;
      if (t.indexOf("ORIGEN") !== -1 || t.indexOf("BRIGEN") !== -1) return true;
      if (t.indexOf("BARCELONA") !== -1 || t.indexOf("XPRESS") !== -1 || t.indexOf("BIP") !== -1) return true;
      if (t.indexOf("COBRO EN DESTINO") !== -1) return true;
      if (t.indexOf("CONTRA REEMBOLSO") !== -1) return true;
      if (t.indexOf("DESTINO:") !== -1) return true;
      if (t.indexOf("CEDULA") !== -1 || t.indexOf("CÉDULA") !== -1 || t.indexOf("DCEDULA") !== -1) return true;
      if (t.indexOf("RIF") !== -1 || t.indexOf("R.I.F") !== -1 || t.indexOf("RLFICI") !== -1 || t.indexOf("R.L.F.I.C.I") !== -1) return true;
      if (t.indexOf("COD.SEG") !== -1 || t.indexOf("CAD.SEY") !== -1 || t.indexOf("CAD.8NY") !== -1 || t.indexOf("BISUTERIA") !== -1 || t.indexOf("1/1") !== -1 || t.indexOf("MER") !== -1) return true;
      return false;
    }

    function depurarNombre(txt) {
      var resultado = txt;

      resultado = resultado.replace(/^[\|\/\\\,\.\-_\:\;\s\d]+/g, "");

      resultado = resultado.replace(/\bZOOM\b/gi, "");
      resultado = resultado.replace(/b?estinatario[\s:]*/gi, "");
      resultado = resultado.replace(/DESTINO:/gi, "");
      resultado = resultado.replace(/\bDEST\b[\s:]*/gi, "");
      resultado = resultado.replace(/DATOS DEL/gi, "");
      resultado = resultado.replace(/CONSIGNA A/gi, "");
      resultado = resultado.replace(/RECEPTOR/gi, "");
      resultado = resultado.replace(/NOMBRE/gi, "");
      resultado = resultado.replace(/CLIENTE/gi, "");
      resultado = resultado.replace(/AGENCIA/gi, "");
      resultado = resultado.replace(/OFICINA/gi, "");
      resultado = resultado.replace(/ORIGEN/gi, "");
      resultado = resultado.replace(/BRIGEN/gi, "");
      resultado = resultado.replace(/BARCELONA/gi, "");
      resultado = resultado.replace(/XPRESS/gi, "");
      resultado = resultado.replace(/D?CEDULA[\s\d\*\-]*/gi, "");
      resultado = resultado.replace(/R\.?I\.?F\.?\/C\.?I\.?[\s:]*/gi, "");
      resultado = resultado.replace(/RLFICI[\s:]*/gi, "");

      resultado = resultado.replace(/TLF[\s:\.]*\d+/gi, "");
      resultado = resultado.replace(/\b(?:0)?(412|424|414|416|426)\d{7}\b/g, "");
      resultado = resultado.replace(/\b[VEPGJ][\-\s]?\d{5,9}\b/gi, "");
      resultado = resultado.replace(/[:\.\-]/g, " ");

      var palabras = resultado.trim().split(/\s+/).filter(Boolean);

      if (palabras.length > 1) {
        var depuradas = [];
        for (var i = 0; i < palabras.length; i++) {
          var pCur = palabras[i].toUpperCase();
          var esSombra = false;
          for (var j = 0; j < palabras.length; j++) {
            if (i !== j) {
              var pOtro = palabras[j].toUpperCase();
              if (pOtro.length >= 4 && pCur.indexOf(pOtro) !== -1 && pCur.length > pOtro.length) {
                esSombra = true;
                break;
              }
            }
          }
          if (!esSombra) {
            depuradas.push(palabras[i]);
          }
        }
        palabras = depuradas;
      }

      var unicas = [];
      var vistas = new Set();
      for (var k = 0; k < palabras.length; k++) {
        var pUpper = palabras[k].toUpperCase();
        if (pUpper.length > 1 && !vistas.has(pUpper)) {
          vistas.add(pUpper);
          unicas.push(palabras[k]);
        }
      }

      if (unicas.length === 2) {
        var p0 = unicas[0].toUpperCase();
        var p1 = unicas[1].toUpperCase();
        var nombresComunes = ["ANDREINA", "RICARDO", "CARLOS", "MARIA", "JOSE", "LUIS", "ANA", "PEDRO", "JUAN", "SOFIA", "HAYDEE", "DAYANA", "GISELA"];
        if (nombresComunes.indexOf(p1) !== -1 && nombresComunes.indexOf(p0) === -1) {
          unicas = [unicas[1], unicas[0]];
        }
      }

      return unicas.join(" ").trim();
    }

    function formatearTelefonoStrict(numBruto) {
      if (!numBruto) return "";
      var num = numBruto.replace(/\D/g, "");
      
      if (/^58(412|424|414|416|426)\d{7}$/.test(num)) {
        return num;
      }
      if (/^0(412|424|414|416|426)\d{7}$/.test(num)) {
        return "58" + num.substring(1);
      }
      if (/^(412|424|414|416|426)\d{7}$/.test(num)) {
        return "58" + num;
      }
      return "";
    }

    function procesarTextoGuia() {
      try {
        var text = document.getElementById("rawText").value;
        if (!text || !text.trim()) {
          alert("Primero pega el texto en el recuadro.");
          return;
        }

        var lineas = text.split("\n");
        var tUpper = text.toUpperCase();

        // 1. DETECTAR EMPRESA
        var empresaDetectada = "MRW";
        if (tUpper.indexOf("TEALCA") !== -1) empresaDetectada = "Tealca";
        else if (tUpper.indexOf("ZOOM") !== -1 || tUpper.indexOf("GRUPO ZOOM") !== -1) empresaDetectada = "Zoom";
        else if (tUpper.indexOf("MRW") !== -1) empresaDetectada = "MRW";
        else if (tUpper.indexOf("LIBERTY") !== -1) empresaDetectada = "Liberty Express";

        document.getElementById("empresa").value = empresaDetectada;

        // 2. EXTRAER TELÉFONO
        var tlfEncontrado = "";
        var matchTelf = text.match(/(?:\+?58|0)?[\s\.-]*?(412|424|414|416|426)[\s\.-]*?\d{3}[\s\.-]*?\d{4}\b/g);
        
        if (matchTelf && matchTelf.length > 0) {
          var telefonosValidos = [];
          for (var m = 0; m < matchTelf.length; m++) {
            var tValido = formatearTelefonoStrict(matchTelf[m]);
            if (tValido) {
              telefonosValidos.push(tValido);
            }
          }
          
          if (telefonosValidos.length > 1) {
            tlfEncontrado = telefonosValidos[telefonosValidos.length - 1];
          } else if (telefonosValidos.length === 1) {
            tlfEncontrado = telefonosValidos[0];
          }
        }
        document.getElementById("telefono").value = tlfEncontrado;

        // 3. EXTRAER DESTINATARIO
        var nombreEncontrado = "";

        for (var i = 0; i < lineas.length; i++) {
          var l = lineas[i].trim();
          var lUpper = l.toUpperCase();

          if (lUpper.indexOf("ESTINATARIO") !== -1 || lUpper.indexOf("DEST:") !== -1) {
            var limpioMisma = depurarNombre(l);
            if (limpioMisma.length > 2 && !esLineaBasura(limpioMisma)) {
              nombreEncontrado = limpioMisma;
            } else {
              for (var sub = 1; sub <= 2; sub++) {
                if (i + sub < lineas.length) {
                  var sigLinea = lineas[i + sub].trim();
                  if (esLineaBasura(sigLinea)) continue;
                  var limpioSig = depurarNombre(sigLinea);
                  if (limpioSig.length > 2 && !esLineaBasura(limpioSig)) {
                    nombreEncontrado = limpioSig;
                    break;
                  }
                }
              }
            }
            if (nombreEncontrado) break;
          }
        }

        if (!nombreEncontrado) {
          for (var j = 0; j < lineas.length; j++) {
            var lj = lineas[j].trim();
            if (esLineaBasura(lj)) continue;
            var limpioFallback = depurarNombre(lj);
            if (limpioFallback.length > 3 && /[a-zA-Z]/.test(limpioFallback) && !esLineaBasura(limpioFallback)) {
              nombreEncontrado = limpioFallback;
              break;
            }
          }
        }

        if (nombreEncontrado) {
          document.getElementById("nombre").value = nombreEncontrado;
        }

        // 4. EXTRAER TRACKING POR BLOQUES SEGÚN EMPRESA
        var trackingEncontrado = "";

        if (empresaDetectada === "MRW") {
          // BLOQUE MRW
          var matchMrw = text.match(/TRACKING[\s:]*(\d{10,20})/i);
          if (matchMrw && matchMrw[1]) {
            trackingEncontrado = matchMrw[1];
          } else {
            var numLargoMrw = text.match(/\b\d{12,18}\b/g);
            if (numLargoMrw && numLargoMrw.length > 0) {
              trackingEncontrado = numLargoMrw[0];
            }
          }
        } 
        else if (empresaDetectada === "Zoom") {
          // BLOQUE ZOOM
          for (var k = 0; k < lineas.length; k++) {
            var lk = lineas[k].toUpperCase();
            if (lk.indexOf("TRACKING") !== -1 || lk.indexOf("GUIA") !== -1 || lk.indexOf("GUÍA") !== -1 || lk.indexOf("DOC") !== -1 || lk.indexOf("NRO") !== -1) {
              var mTrackL = lineas[k].match(/\b\d{7,14}\b/);
              if (mTrackL) {
                trackingEncontrado = mTrackL[0];
                break;
              }
            }
          }
          if (!trackingEncontrado) {
            var numTelfPuro = tlfEncontrado ? tlfEncontrado.replace("58", "") : "";
            var todosNumeros = text.match(/\b\d{8,14}\b/g) || [];
            for (var n = 0; n < todosNumeros.length; n++) {
              var candidate = todosNumeros[n];
              if (numTelfPuro && candidate.indexOf(numTelfPuro) !== -1) continue;
              if (/^(0?412|0?424|0?414|0?416|0?426)/.test(candidate)) continue;
              trackingEncontrado = candidate;
              break;
            }
          }
        } 
        else {
          // BLOQUE TEALCA / OTROS
          for (var k2 = 0; k2 < lineas.length; k2++) {
            var lk2 = lineas[k2].toUpperCase();
            if (lk2.indexOf("TRACKING") !== -1 || lk2.indexOf("GUIA") !== -1 || lk2.indexOf("GUÍA") !== -1 || lk2.indexOf("DOC") !== -1 || lk2.indexOf("NRO") !== -1) {
              var mTrackL2 = lineas[k2].match(/\b\d{7,16}\b/);
              if (mTrackL2) {
                trackingEncontrado = mTrackL2[0];
                break;
              }
            }
          }
          if (!trackingEncontrado) {
            var todosNumGen = text.match(/\b\d{7,16}\b/g) || [];
            for (var g = 0; g < todosNumGen.length; g++) {
              if (!/^(0?412|0?424|0?414|0?416|0?426)/.test(todosNumGen[g])) {
                trackingEncontrado = todosNumGen[g];
                break;
              }
            }
          }
        }

        if (trackingEncontrado) {
          document.getElementById("tracking").value = trackingEncontrado;
        }

      } catch (e) {
        alert("Error al procesar: " + e.message);
      }
    }

    var form = document.getElementById("guiaForm");
    var lista = document.getElementById("listaGuias");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var nombre = document.getElementById("nombre").value.trim();
      var telf = document.getElementById("telefono").value.trim();
      var tracking = document.getElementById("tracking").value.trim();
      var empresa = document.getElementById("empresa").value;
      var fechaRaw = document.getElementById("fecha").value;

      var partes = fechaRaw.split("-");
      var fechaFormateada = partes[2] + "/" + partes[1] + "/" + partes[0];

      var textoMensaje =
        "Hola Sr./Sra. " + nombre + ", 👋\n\n" +
        "Su pedido ya fue enviado. Aquí el resumen:\n\n" +
        "📦 Empresa: " + empresa + "\n" +
        "🔢 Tracking: " + tracking + "\n" +
        "📅 Fecha de envío: " + fechaFormateada + "\n\n" +
        "Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n" +
        "Gracias por su compra! 🙏\n" +
        "Recuerde que es importante darle los cuidados adecuados:\n" +
        "❤️Mantener limpias y secas.\n" +
        "❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n" +
        "❤️Colocar cuando la piel esté seca\n" +
        "❤️No mojar ni usar en playa o piscinas\n" +
        "❤️Evitar hacer ejercicios con ellas\n\n" +
        "De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n" +
        "Saludos Myriedesign";

      var linkWa = "https://api.whatsapp.com/send?phone=" + telf + "&text=" + encodeURIComponent(textoMensaje);

      var card = document.createElement("div");
      card.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2";
      card.innerHTML =
        '<div class="flex justify-between items-start">' +
        "<div>" +
        '<p class="font-bold text-gray-800 text-sm">' + nombre + "</p>" +
        '<p class="text-xs text-gray-500">' + empresa + " - Guía: " + tracking + "</p>" +
        '<p class="text-xs text-gray-400">📅 ' + fechaFormateada + "</p>" +
        "</div>" +
        '<a href="' + linkWa + '" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow inline-flex items-center gap-1">WhatsApp</a>' +
        "</div>";

      lista.prepend(card);
      form.reset();
      document.getElementById("rawText").value = "";
      document.getElementById("fecha").valueAsDate = new Date();
    });
  </script>
</body>
</html>
